<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>看得见的声音 · 维护后台</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --ink:#1f2329; --sub:#6b7280; --brand:#2563eb; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#111827; color:#fff; padding:10px 20px; display:flex; align-items:center; gap:16px; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .who { margin-left:auto; font-size:12px; color:#9ca3af; }
  nav { display:flex; gap:4px; background:#fff; border-bottom:1px solid var(--line); padding:0 12px; }
  nav button { border:0; background:none; padding:10px 14px; cursor:pointer; font-size:14px; color:var(--sub); border-bottom:2px solid transparent; }
  nav button.on { color:var(--brand); border-bottom-color:var(--brand); font-weight:600; }
  main { padding:16px 20px; max-width:1200px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:14px; }
  .card h3 { margin:0 0 10px; font-size:14px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--sub); font-weight:500; white-space:nowrap; }
  .btn { border:1px solid var(--brand); color:var(--brand); background:#fff; border-radius:6px; padding:4px 10px; cursor:pointer; font-size:13px; }
  .btn.danger { border-color:var(--bad); color:var(--bad); }
  .btn.ok { border-color:var(--ok); color:var(--ok); }
  .btn:disabled { opacity:.4; cursor:default; }
  input,select,textarea { font:inherit; border:1px solid var(--line); border-radius:6px; padding:6px 8px; width:100%; }
  textarea.code { font-family:Consolas,monospace; font-size:12px; min-height:320px; white-space:pre; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .row > * { flex:0 0 auto; }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; }
  .tag.pub { background:#dcfce7; color:#166534; }
  .tag.off { background:#f1f5f9; color:#475569; }
  .tag.pend { background:#fef3c7; color:#92400e; }
  #login { max-width:360px; margin:80px auto; }
  .muted { color:var(--sub); font-size:12px; }
  .form-field { display:block; margin:12px 0; }
  .form-field textarea { min-height:110px; }
  #art-markdown { min-height:300px; font-family:Consolas,monospace; }
  fieldset { border:1px solid var(--line); border-radius:6px; margin:14px 0; padding:12px; }
  .list-row { display:flex; gap:10px; align-items:end; flex-wrap:wrap; margin-bottom:10px; }
  .list-row label { flex:1; min-width:120px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:800px){ .grid2 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>看得见的声音 · 维护后台</h1>
  <span class="who" id="who"></span>
</header>
<div id="login" class="card" style="display:none">
  <h3>管理员登录</h3>
  <div class="row"><input id="lu" placeholder="用户名"></div>
  <div class="row"><input id="lp" type="password" placeholder="密码"></div>
  <button class="btn" onclick="doLogin()">登录</button>
</div>
<nav id="nav" style="display:none">
  <button data-t="overview" class="on">总览</button>
  <button data-t="levels">关卡</button>
  <button data-t="articles">文章</button>
  <button data-t="media">媒体</button>
  <button data-t="calibration">标定配置</button>
  <button data-t="feedback">反馈</button>
</nav>
<main id="main" style="display:none"></main>

<script>
const $ = (s)=>document.querySelector(s);
const esc = (s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path, opts={}){
  const r = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts));
  const j = await r.json().catch(()=>({code:'PARSE',message:'无响应'}));
  if(!r.ok && j.code!=='CALIBRATION_FAIL') alert(`${j.code||r.status}: ${j.message||''}`);
  return j;
}
async function doLogin(){
  const j = await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('#lu').value,password:$('#lp').value})});
  if(j.code==='OK'){ location.reload(); }
}
async function boot(){
  const ov = await api('/api/admin/overview');
  if(ov.code!=='OK'){ $('#login').style.display='block'; return; }
  $('#login').style.display='none'; $('#nav').style.display='flex'; $('#main').style.display='block';
  $('#who').textContent = '已登录';
  render();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); render();
});
const tab = ()=>document.querySelector('nav button.on').dataset.t;

async function render(){
  const m = $('#main'); const t = tab();
  if(t==='overview') await renderOverview();
  if(t==='levels') await renderLevels();
  if(t==='articles') await renderArticles();
  if(t==='media') await renderMedia();
  if(t==='calibration') await renderCalibration();
  if(t==='feedback') await renderFeedback();
}

async function renderOverview(){
  const m=$('#main');
  const j = await api('/api/admin/overview'); const d=j.data;
  m.innerHTML = `<div class="grid2">
    <div class="card"><h3>内容</h3><table>
      <tr><th>已开放关卡</th><td>${d.levels.published} / ${d.levels.total}</td></tr>
      <tr><th>已开放文章</th><td>${d.articles.published} / ${d.articles.total}</td></tr>
      <tr><th>学习用户</th><td>${d.users}</td></tr>
    </table></div>
    <div class="card"><h3>运行</h3><table>
      <tr><th>录音总数</th><td>${d.recordings}</td></tr>
      <tr><th>执行器</th><td>${JSON.stringify(d.executor)}</td></tr>
      <tr><th>清理积压</th><td>${d.cleanupBacklog}</td></tr>
      <tr><th>待处理反馈/希望</th><td>${d.pendingFeedback} / ${d.pendingWishes}</td></tr>
    </table></div></div>`;
}

async function renderLevels(){
  const m=$('#main');
  const j = await api('/api/admin/levels');
  const rows = j.data.levels.map(l=>`<tr>
    <td><b>${l.id}</b></td><td>${esc(l.title||'')}</td><td>${esc(l.targetSound||'')}</td>
    <td><span class="tag ${l.published?'pub':'off'}">${l.published?'已开放':'未开放'}</span></td>
    <td>${(l.updatedAt||'').slice(0,10)}</td>
    <td>
      <button class="btn" onclick="editLevel('${l.id}')">编辑</button>
      <button class="btn ${l.published?'':'ok'}" onclick="toggleLevel('${l.id}',${!l.published})">
        ${l.published?'设为未开放':'设为已开放'}</button>
    </td></tr>`).join('');
  m.innerHTML = `<div class="card"><h3>关卡（修改保存即生效；开放 / 未开放一个开关）</h3>
    <table><tr><th>ID</th><th>标题</th><th>目标音</th><th>状态</th><th>更新时间</th><th>操作</th></tr>${rows}</table>
    ${j.data.levels.length?'':'<p class="muted">暂无关卡，请先导入关卡内容；导入后即可在此编辑和设置开放状态。</p>'}
    <p class="muted">编辑字段、保存后用户端立即读取最新内容。</p></div>
    <div class="card" id="editor" style="display:none"><h3 id="ed-title"></h3><div id="ed-body"></div></div>`;
}
let levelDraft, articleDraft;
function field(id,label,value='',multiline=false){
  return `<label class="form-field">${esc(label)}${multiline
    ?`<textarea id="${id}" rows="4">${esc(value)}</textarea>`
    :`<input id="${id}" value="${esc(value)}">`}</label>`;
}
function listForm(id,title,items,columns){
  return `<fieldset id="${id}"><legend>${esc(title)}</legend><div class="list-items">${items.map(item=>listRow(item,columns)).join('')}</div>
    <button type="button" class="btn" onclick="addListRow('${id}')">添加${esc(title)}</button></fieldset>`;
}
const listColumns={};
const listOriginals=new WeakMap();
function listRow(item,columns){
  return `<div class="list-row">${columns.map(([key,label,options])=>options
    ?`<label>${esc(label)}<select data-key="${key}">${options.map(v=>`<option value="${esc(v)}" ${item[key]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`
    :`<label>${esc(label)}<input data-key="${key}" value="${esc(item[key]||'')}"></label>`).join('')}
    <button type="button" class="btn danger" onclick="this.parentElement.remove()">移除</button></div>`;
}
function bindList(id,items,columns){
  listColumns[id]=columns;
  document.querySelectorAll(`#${id} .list-row`).forEach((row,i)=>listOriginals.set(row,items[i]));
}
function addListRow(id){ $('#'+id+' .list-items').insertAdjacentHTML('beforeend',listRow({},listColumns[id])); }
function readList(id){
  return [...document.querySelectorAll(`#${id} .list-row`)].map(row=>{
    const item={...(listOriginals.get(row)||{})};
    row.querySelectorAll('[data-key]').forEach(el=>item[el.dataset.key]=el.value.trim());
    return item;
  });
}
const demoColumns=[['mediaId','媒体 ID'],['speed','语速',['normal','slow']],['voice','发音人']];
const stepColumns=[['text','练习步骤']];
async function editLevel(id){
  const j=await api(`/api/admin/levels/${encodeURIComponent(id)}`); if(j.code!=='OK')return;
  levelDraft=structuredClone(j.data.content); const c=levelDraft, det=c.detection||{};
  $('#editor').style.display='block'; $('#ed-title').textContent=`${id} 内容`;
  $('#ed-body').innerHTML=`<div class="row"><button class="btn" id="save-level">保存</button><button class="btn" id="check-level">检查已保存内容</button></div>
    <div class="grid2">${field('lv-title','标题',c.title)}${field('lv-target','目标音',c.targetSound)}
    ${field('lv-pinyin','拼音',c.pinyin)}${field('lv-char','代表字',c.representativeChar)}
    ${field('lv-type','类型',c.type)}${field('lv-conf','易混音关卡 ID（用逗号分隔）',(c.confusables||[]).join(', '))}</div>
    ${listForm('lv-practice','练习步骤',(c.practice||[]).map(text=>({text})),stepColumns)}
    ${field('lv-prof','专业说明',c.professional?.description,true)}
    <div class="grid2">${field('lv-prompt','朗读提示词',det.promptText)}${field('lv-eval','评测文本',det.evaluationText)}
    ${field('lv-evalpy','评测拼音（如 ma1 ma5）',det.evaluationPinyin)}${field('lv-sample','参考示范音频媒体 ID',det.sampleMediaId)}
    ${field('lv-speaker','参考发音人 ID',det.referenceSpeakerId)}</div>
    ${listForm('lv-demos','示范音频',c.demos||[],demoColumns)}
    <details><summary>声学与语音配置（JSON）</summary><p class="muted">保留语音学定位及评测参数；标准曲线由系统生成，不在此编辑。</p>
    ${field('lv-acoustic','声学与语音配置',JSON.stringify({phonology:c.phonology||{},detection:Object.fromEntries(Object.entries(det).filter(([k])=>!['promptText','evaluationText','evaluationPinyin','sampleMediaId','referenceSpeakerId'].includes(k)))},null,2),true)}</details>
    <div id="ed-result" role="status"></div>`;
  bindList('lv-practice',(c.practice||[]).map(text=>({text})),stepColumns); bindList('lv-demos',c.demos||[],demoColumns);
  $('#save-level').onclick=()=>saveLevel(id); $('#check-level').onclick=()=>precheck(id);
}
async function saveLevel(id){
  let acoustic; try{ acoustic=JSON.parse($('#lv-acoustic').value); if(!acoustic||Array.isArray(acoustic)||typeof acoustic!=='object'||!acoustic.detection||Array.isArray(acoustic.detection)||typeof acoustic.detection!=='object'||!acoustic.phonology||Array.isArray(acoustic.phonology)||typeof acoustic.phonology!=='object')throw Error('应包含 phonology 和 detection 对象'); }
  catch(e){ alert('声学配置 JSON 无效：'+e.message); return; }
  const content=structuredClone(levelDraft);
  Object.assign(content,{title:$('#lv-title').value.trim(),targetSound:$('#lv-target').value.trim(),pinyin:$('#lv-pinyin').value.trim(),representativeChar:$('#lv-char').value.trim(),type:$('#lv-type').value.trim(),confusables:$('#lv-conf').value.split(/[,，\s]+/).filter(Boolean),practice:readList('lv-practice').map(x=>x.text),demos:readList('lv-demos'),phonology:acoustic.phonology});
  content.professional={...content.professional,description:$('#lv-prof').value.trim()};
  content.detection={...acoustic.detection,promptText:$('#lv-prompt').value.trim(),evaluationText:$('#lv-eval').value.trim(),evaluationPinyin:$('#lv-evalpy').value.trim(),sampleMediaId:$('#lv-sample').value.trim()||null,referenceSpeakerId:$('#lv-speaker').value.trim()||null};
  const j=await api(`/api/admin/levels/${encodeURIComponent(id)}`,{method:'PUT',body:JSON.stringify({content})});
  if(j.code==='OK'){ levelDraft=content; $('#ed-result').textContent='已保存，前端立即生效。'; }
}
async function precheck(id){
  const j=await api(`/api/admin/levels/${id}/precheck`,{method:'POST'});
  if(j.code!=='OK')return;
  const d=j.data;
  $('#ed-result').innerHTML = d.ok ? '<p style="color:var(--ok)">内容完整。</p>'
    : `<p style="color:var(--warn)">缺失项：<br>${d.missing.map(esc).join('<br>')}</p>`;
}
async function toggleLevel(id,published){
  const j = await api(`/api/admin/levels/${id}/published`,{method:'PUT',body:JSON.stringify({published})});
  if(j.code==='OK') render();
}

async function renderArticles(){
  const m=$('#main');
  const j = await api('/api/admin/articles'); const cats=await api('/api/admin/categories');
  const rows=j.data.articles.map(a=>`<tr><td>${a.slug}</td><td>${esc(a.title||'')}</td><td>${esc(a.category||'')}</td>
    <td><span class="tag ${a.published?'pub':'off'}">${a.published?'已开放':'未开放'}</span></td>
    <td><button class="btn" onclick="editArticle('${a.slug}')">编辑</button>
      <button class="btn ${a.published?'':'ok'}" onclick="toggleArticle('${a.slug}',${!a.published})">
        ${a.published?'设为未开放':'设为已开放'}</button>
      <button class="btn danger" onclick="delArticle('${a.slug}')">删除</button></td></tr>`).join('');
  const catRows=cats.data.categories.map(c=>`<tr><td>${esc(c.name)}</td><td>
      <button class="btn" onclick="renameCat(${c.id},'${esc(c.name)}')">改名</button>
      <button class="btn danger" onclick="delCat(${c.id},'${esc(c.name)}')">删除</button></td></tr>`).join('');
  m.innerHTML=`<div class="card"><h3>原理文章</h3>
    <table><tr><th>slug</th><th>标题</th><th>分类</th><th>状态</th><th>操作</th></tr>${rows}</table>
    <div class="row" style="margin-top:10px"><input id="new-slug" placeholder="新文章 slug（英文）" style="max-width:220px">
      <button class="btn" onclick="createArticle()">新建文章</button></div></div>
    <div class="card"><h3>分类</h3>
    <table><tr><th>名称</th><th>操作</th></tr>${catRows}</table>
    <div class="row" style="margin-top:10px"><input id="new-cat" placeholder="新分类名" style="max-width:160px">
      <button class="btn" onclick="addCat()">新建分类</button></div></div>
    <div class="card" id="art-editor" style="display:none"><h3 id="art-title"></h3><div id="art-body"></div></div>`;
}
async function createArticle(){
  const slug=$('#new-slug').value.trim(); if(!slug) return;
  const j = await api('/api/admin/articles',{method:'POST',body:JSON.stringify({content:{slug,title:'新文章',category:'',summary:'',markdown:'',demoMediaId:null,demoText:'',practice:[],references:[],relatedLevelIds:[]}})});
  if(j.code==='OK'){ await renderArticles(); await editArticle(slug); }
}
const articlePracticeColumns=[['title','练习标题'],['instruction','练习说明']];
const referenceColumns=[['title','资料标题'],['source','来源'],['license','授权说明']];
async function editArticle(slug){
  const [j,cats]=await Promise.all([api(`/api/admin/articles/${encodeURIComponent(slug)}`),api('/api/admin/categories')]);
  if(j.code!=='OK'||cats.code!=='OK')return;
  articleDraft=structuredClone(j.data.content); const c=articleDraft;
  const names=[...new Set([c.category,...cats.data.categories.map(x=>x.name)].filter(Boolean))];
  $('#art-editor').style.display='block'; $('#art-title').textContent=slug;
  $('#art-body').innerHTML=`<button class="btn" id="save-article">保存</button>
    ${field('art-name','标题',c.title)}<label class="form-field">分类<select id="art-category"><option value="">请选择分类</option>${names.map(n=>`<option value="${esc(n)}" ${n===c.category?'selected':''}>${esc(n)}</option>`).join('')}</select></label>
    ${field('art-summary','摘要',c.summary,true)}${field('art-markdown','Markdown 正文',c.markdown,true)}
    <div class="grid2">${field('art-demo','示范媒体 ID',c.demoMediaId)}${field('art-demotext','示范文本',c.demoText)}</div>
    ${field('art-related','关联关卡 ID（逗号分隔）',(c.relatedLevelIds||[]).join(', '))}
    ${listForm('art-practice','短练习',c.practice||[],articlePracticeColumns)}
    ${listForm('art-refs','参考资料',c.references||[],referenceColumns)}<div id="art-result" role="status"></div>`;
  bindList('art-practice',c.practice||[],articlePracticeColumns); bindList('art-refs',c.references||[],referenceColumns);
  $('#save-article').onclick=()=>saveArticle(slug);
}
async function saveArticle(slug){
  const content={...articleDraft,slug,title:$('#art-name').value.trim(),category:$('#art-category').value,summary:$('#art-summary').value.trim(),markdown:$('#art-markdown').value,demoMediaId:$('#art-demo').value.trim()||null,demoText:$('#art-demotext').value.trim(),relatedLevelIds:$('#art-related').value.split(/[,，\s]+/).filter(Boolean),practice:readList('art-practice'),references:readList('art-refs')};
  if(!content.title||!content.category){ alert('请填写标题并选择分类；没有分类时请先新建分类。'); return; }
  const j=await api(`/api/admin/articles/${encodeURIComponent(slug)}`,{method:'PUT',body:JSON.stringify({content})});
  if(j.code==='OK'){ articleDraft=content; $('#art-result').textContent='已保存，前端立即生效。'; }
}
async function toggleArticle(slug,published){
  const j = await api(`/api/admin/articles/${slug}/published`,{method:'PUT',body:JSON.stringify({published})});
  if(j.code==='OK') render();
}
async function delArticle(slug){ if(!confirm(`确认删除文章 ${slug}？`))return;
  const j = await api(`/api/admin/articles/${slug}`,{method:'DELETE'}); if(j.code==='OK') render(); else alert(j.message); }
async function addCat(){ const n=$('#new-cat').value.trim(); if(!n)return;
  await api('/api/admin/categories',{method:'POST',body:JSON.stringify({name:n})}); render(); }
async function renameCat(id,old){ const n=prompt('新名称',old); if(!n||n===old)return;
  await api(`/api/admin/categories/${id}`,{method:'PUT',body:JSON.stringify({name:n})}); render(); }
async function delCat(id,name){ if(!confirm(`确认删除分类「${name}」？仍被文章使用时无法删除。`))return;
  const j = await api(`/api/admin/categories/${id}`,{method:'DELETE'}); if(j.code==='OK') render(); else alert(j.message); }

async function renderMedia(){
  const m=$('#main'); const j=await api('/api/admin/media');
  const rows=j.data.media.map(x=>`<tr><td title="${x.id}">${x.id.slice(0,10)}…</td><td>${x.kind}</td>
    <td>${esc(x.filename)}</td><td>${(x.sizeBytes/1024).toFixed(0)}KB</td>
    <td>${esc(x.licenseNote||'')}</td>
    <td><button class="btn danger" onclick="delMedia('${x.id}')">删除</button></td></tr>`).join('');
  m.innerHTML=`<div class="card"><h3>媒体（示范音频 / 构形图 / 字幕等；仍被内容引用时不可删）</h3>
    <div class="row">
      <input type="file" id="mf" style="max-width:260px">
      <select id="mk" style="max-width:120px"><option>audio</option><option>image</option><option>animation</option><option>video</option><option>subtitle</option><option>model</option></select>
      <input id="mp" placeholder="用途：content/demo/quiz/article" style="max-width:200px">
      <input id="ml" placeholder="授权说明" style="max-width:200px">
      <input id="mt" placeholder="音频对应文字" style="max-width:160px">
      <button class="btn" onclick="upMedia()">上传</button></div>
    <table><tr><th>ID</th><th>类型</th><th>文件名</th><th>大小</th><th>授权</th><th>操作</th></tr>${rows}</table></div>`;
}
async function upMedia(){
  const f=$('#mf').files[0]; if(!f) return;
  const fd=new FormData(); fd.append('file',f); fd.append('kind',$('#mk').value);
  fd.append('purpose',$('#mp').value||'content'); fd.append('licenseNote',$('#ml').value); fd.append('text',$('#mt').value);
  const r=await fetch('/api/admin/media',{method:'POST',body:fd});
  const j=await r.json(); if(j.code==='OK'){ alert('已上传：'+j.data.mediaId); render(); } else alert(j.message);
}
async function delMedia(id){ if(!confirm('确认删除该媒体？'))return;
  const j = await api(`/api/admin/media/${id}`,{method:'DELETE'}); if(j.code==='OK') render(); else alert(j.message); }

async function renderCalibration(){
  const m=$('#main');
  const cal=await api('/api/admin/calibration-text');
  const spk=await api('/api/admin/reference-speakers');
  const spkRows=spk.data.speakers.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.gender}</td><td>${s.fLo}–${s.fHi} Hz</td><td>${s.id}</td></tr>`).join('');
  m.innerHTML=`<div class="grid2">
    <div class="card"><h3>音域标定朗读文本（须覆盖六个单韵母）</h3>
      <p>当前版本 <b>${cal.data.textVersion||'未配置'}</b>：${esc(cal.data.text||'')}</p>
      <textarea id="cal-text" placeholder="新标定文本" oninput="syncCalSyllables()">${esc(cal.data.text||'')}</textarea>
      <p class="muted">请为每个汉字填写带数字声调的拼音，如 ma1、nv3，轻声用 5。标点不需要拼音。</p>
      <div id="cal-syllables"></div>
      <div class="row"><input id="cal-ver" aria-label="版本号" placeholder="版本号，如 v2" value="${esc(cal.data.textVersion||'')}" style="max-width:120px">
        <button class="btn" onclick="setCal()">保存</button></div></div>
    <div class="card"><h3>参考发音人（上传其朗读标定文本的音频后登记）</h3>
      <table><tr><th>姓名</th><th>性别</th><th>音域</th><th>ID</th></tr>${spkRows}</table>
      <div class="row" style="margin-top:8px">
        <input id="spk-name" placeholder="姓名" style="max-width:120px">
        <select id="spk-g" style="max-width:90px"><option>male</option><option>female</option></select>
        <input id="spk-media" placeholder="媒体ID（先在媒体页上传wav）" style="max-width:260px">
        <button class="btn" onclick="addSpeaker()">登记</button></div></div></div>`;
  syncCalSyllables(cal.data.syllables||[]);
}
function alignCalPinyin(previous, chars){
  // 按保持顺序的相同汉字匹配，插入或删除文字不会清空后续标注。
  const lengths=Array.from({length:previous.length+1},()=>new Uint32Array(chars.length+1));
  for(let i=previous.length-1;i>=0;i--){
    for(let j=chars.length-1;j>=0;j--){
      lengths[i][j]=previous[i].text===chars[j]
        ?1+lengths[i+1][j+1]:Math.max(lengths[i+1][j],lengths[i][j+1]);
    }
  }
  const pinyin=chars.map(()=>'');
  let i=0,j=0;
  while(i<previous.length&&j<chars.length){
    if(previous[i].text===chars[j]){ pinyin[j]=previous[i].pinyin; i++; j++; }
    else if(lengths[i+1][j]>=lengths[i][j+1]) i++;
    else j++;
  }
  return pinyin;
}
function syncCalSyllables(saved){
  const container=$('#cal-syllables');
  const previous=saved||[...container.querySelectorAll('input')].map(input=>({text:input.dataset.char,pinyin:input.value}));
  const chars=[...$('#cal-text').value].filter(c=>/[\u4e00-\u9fff]/.test(c));
  const pinyin=alignCalPinyin(previous,chars);
  container.innerHTML=chars.map((char,i)=>`<label class="row">${i+1}. ${esc(char)}
    <input data-char="${esc(char)}" aria-label="第${i+1}个字${esc(char)}的拼音" placeholder="如 ma1" style="max-width:140px"
      value="${esc(pinyin[i])}"></label>`).join('');
}
async function setCal(){
  const text=$('#cal-text').value.trim();
  const textVersion=$('#cal-ver').value.trim();
  const inputs=[...$('#cal-syllables').querySelectorAll('input')];
  if(!textVersion||!inputs.length){ alert('请填写版本号和包含汉字的标定文本'); return; }
  const invalid=inputs.find(input=>! /^[a-zv:ü]+[0-9]$/i.test(input.value.trim()));
  if(invalid){ alert(`请填写“${invalid.dataset.char}”的带调拼音，如 ma1、nv3`); invalid.focus(); return; }
  const syllables=inputs.map(input=>({text:input.dataset.char,pinyin:input.value.trim().toLowerCase()}));
  const j=await api('/api/admin/calibration-text',{method:'PUT',body:JSON.stringify({textVersion,text,syllables})});
  if(j.code==='OK'){ alert('已保存'); await renderCalibration(); }
}
async function addSpeaker(){
  const j=await api('/api/admin/reference-speakers',{method:'POST',body:JSON.stringify({
    name:$('#spk-name').value, gender:$('#spk-g').value, mediaId:$('#spk-media').value})});
  if(j.code==='OK') render(); else alert(j.message);
}
async function renderFeedback(){
  const m=$('#main');
  const fb=await api('/api/admin/feedback?status=');
  const wi=await api('/api/admin/wishes');
  const fbRows=fb.data.feedback.map(f=>`<tr><td>${f.createdAt.slice(0,10)}</td><td>${f.sourcePage}</td><td>${f.type}</td>
    <td>${esc(f.content||'')}</td><td>${f.rating??''}</td><td><span class="tag pend">${f.status}</span></td>
    <td>${f.status==='pending'?`<button class="btn ok" onclick="handleFb('${f.id}','adopted')">采纳</button>
      <button class="btn" onclick="handleFb('${f.id}','rejected')">暂不</button>`:''}</td></tr>`).join('');
  const wiRows=wi.data.wishes.map(w=>`<tr><td>${w.createdAt.slice(0,10)}</td><td>${esc(w.content)}</td><td>${esc(w.searchQuery||'')}</td>
    <td>${w.status==='pending'?`<button class="btn ok" onclick="handleWish('${w.id}','adopted')">采纳</button>
      <button class="btn" onclick="handleWish('${w.id}','rejected')">暂不</button>`:w.status}</td></tr>`).join('');
  m.innerHTML=`<div class="card"><h3>用户反馈</h3>
    <table><tr><th>日期</th><th>来源页</th><th>类型</th><th>内容</th><th>评分</th><th>状态</th><th>操作</th></tr>${fbRows}</table></div>
    <div class="card"><h3>希望增加</h3>
    <table><tr><th>日期</th><th>内容</th><th>搜索词</th><th>操作</th></tr>${wiRows}</table></div>`;
}
async function handleFb(id,st){ await api(`/api/admin/feedback/${id}`,{method:'PUT',body:JSON.stringify({status:st})}); render(); }
async function handleWish(id,st){ await api(`/api/admin/wishes/${id}`,{method:'PUT',body:JSON.stringify({status:st})}); render(); }
boot();
</script>
